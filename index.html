<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Image Upscaler v5</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 16px; max-width: 600px; margin: auto; }
    .card { background: #1e293b; padding: 16px; border-radius: 12px; margin-bottom: 14px; }
    select, input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; }
    button { background: #3b82f6; border: none; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    .green { background: #10b981; }
    #status { color: #38bdf8; margin-top: 10px; font-size: 0.9rem; font-weight: bold; }
    canvas { max-width: 100%; height: auto; margin-top: 10px; border-radius: 8px; background: #020617; }
  </style>
  <!-- Memuat pustaka lewat tag script standar (bukan import dinamis) -->
  <script src="https://jsdelivr.net"></script>
</head>
<body>
  <h2>AI Image Upscaler (v5)</h2>
  <div class="card">
    <input type="file" id="fileInput" accept="image/*" />
    <div id="status">Status: Siap! Silakan pilih gambar.</div>
    <select id="modelSelect">
      <option value="Xenova/swin2SR-classical-sr-x2-64">Swin2SR 2x (Cepat & Natural)</option>
      <option value="Xenova/swin2SR-realworld-sr-x4-64-bsrgan-psnr">Swin2SR 4x (Detail Tajam)</option>
    </select>
    <button type="button" id="btnRun">Mulai Upscale</button>
    <button type="button" id="btnSave" class="green">Simpan Gambar (PNG)</button>
  </div>
  <div class="card" style="text-align:center;">
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const status = document.getElementById('status');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let imgDataUrl = '';
    let pipe = null;
    let lastModel = '';

    // 1. Pilih & tampilkan gambar
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files.item(0);
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        imgDataUrl = ev.target.result;
        const img = new Image();
        img.onload = function() {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
          status.textContent = 'Gambar siap: ' + img.width + ' x ' + img.height + ' px';
        };
        img.src = imgDataUrl;
      };
      reader.readAsDataURL(file);
    });

    // 2. Proses Upscale menggunakan window.transformers
    document.getElementById('btnRun').addEventListener('click', async function() {
      if (!imgDataUrl) return alert('Pilih gambar terlebih dahulu!');
      if (!window.transformers) {
        status.textContent = 'Gagal: Skrip transformers.min.js diblokir jaringan/AdBlock HP Anda.';
        return;
      }

      const btn = this;
      btn.disabled = true;
      const model = document.getElementById('modelSelect').value;

      try {
        window.transformers.env.allowLocalModels = false;
        if (!pipe || lastModel !== model) {
          status.textContent = 'Mengunduh model AI ke HP (tunggu 15-30 detik)...';
          pipe = await window.transformers.pipeline('image-to-image', model);
          lastModel = model;
        }
        status.textContent = 'Sedang memproses upscale gambar...';
        const out = await pipe(imgDataUrl);
        const resCanvas = out.toCanvas();
        canvas.width = resCanvas.width;
        canvas.height = resCanvas.height;
        ctx.drawImage(resCanvas, 0, 0);
        status.textContent = 'Selesai! Ukuran baru: ' + canvas.width + ' x ' + canvas.height + ' px';
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      }
      btn.disabled = false;
    });

    document.getElementById('btnSave').addEventListener('click', function() {
      if (!imgDataUrl) return;
      const a = document.createElement('a');
      a.download = 'upscaled-v5.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    });
  </script>
</body>
</html>
