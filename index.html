<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Upscaler Pro v6 (Offline Ready)</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 16px; max-width: 600px; margin: auto; }
    .card { background: #1e293b; padding: 16px; border-radius: 12px; margin-bottom: 14px; }
    select, input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; }
    button { background: #3b82f6; border: none; font-weight: bold; cursor: pointer; }
    .green { background: #10b981; }
    #status { color: #38bdf8; margin-top: 10px; font-size: 0.9rem; font-weight: bold; }
    canvas { max-width: 100%; height: auto; margin-top: 10px; border-radius: 8px; background: #020617; }
    label { display: block; margin-top: 10px; font-size: 0.85rem; color: #94a3b8; }
  </style>
</head>
<body>
  <h2>Image Upscaler Pro (v6)</h2>
  <div class="card">
    <input type="file" id="fileInput" accept="image/*" />
    <div id="status">Status: Siap! Pilih gambar dari galeri.</div>

    <label>Skala Pembesaran:</label>
    <select id="scaleSelect">
      <option value="2">2x (Cocok untuk lolos minimal 4MP Adobe Stock)</option>
      <option value="3">3x (Resolusi Tinggi)</option>
      <option value="4">4x (Maksimal)</option>
    </select>

    <label>Tingkat Ketajaman Detail (Smart Sharpen):</label>
    <select id="sharpSelect">
      <option value="0.25">Halus & Natural (Direkomendasikan untuk Adobe Stock)</option>
      <option value="0.45">Tajam Sedang (Detail Mikro)</option>
      <option value="0.70">Sangat Tajam (Teks / Ilustrasi)</option>
      <option value="0">Tanpa Penajaman (Murni Halus)</option>
    </select>

    <button type="button" id="btnRun">Proses Upscale Sekarang</button>
    <button type="button" id="btnSave" class="green">Simpan Hasil (PNG)</button>
  </div>

  <div class="card" style="text-align:center;">
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const status = document.getElementById('status');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let origImg = null;

    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files.item(0);
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          origImg = img;
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          status.textContent = 'Gambar asli: ' + img.width + ' x ' + img.height + ' px (' + ((img.width * img.height) / 1000000).toFixed(2) + ' MP)';
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Algoritma Pembesaran Bertahap + Unsharp Mask (Anti-Blur & Tanpa Efek Plastik)
    document.getElementById('btnRun').addEventListener('click', function() {
      if (!origImg) return alert('Pilih gambar terlebih dahulu!');
      status.textContent = 'Memproses gambar...';

      setTimeout(() => {
        const scale = parseInt(document.getElementById('scaleSelect').value);
        const amount = parseFloat(document.getElementById('sharpSelect').value);
        const targetW = origImg.width * scale;
        const targetH = origImg.height * scale;

        // Pembesaran bertahap (step-up) agar garis tepi tetap halus
        let curCanvas = document.createElement('canvas');
        curCanvas.width = origImg.width;
        curCanvas.height = origImg.height;
        let curCtx = curCanvas.getContext('2d');
        curCtx.drawImage(origImg, 0, 0);

        while (curCanvas.width < targetW) {
          const nextW = Math.min(targetW, Math.round(curCanvas.width * 1.5));
          const nextH = Math.min(targetH, Math.round(curCanvas.height * 1.5));
          const nextC = document.createElement('canvas');
          nextC.width = nextW;
          nextC.height = nextH;
          const nextCtx = nextC.getContext('2d');
          nextCtx.imageSmoothingEnabled = true;
          nextCtx.imageSmoothingQuality = 'high';
          nextCtx.drawImage(curCanvas, 0, 0, nextW, nextH);
          curCanvas = nextC;
        }

        canvas.width = targetW;
        canvas.height = targetH;
        ctx.drawImage(curCanvas, 0, 0);

        // Terapkan filter penajaman detail (Convolution Sharpen)
        if (amount > 0) {
          const imgData = ctx.getImageData(0, 0, targetW, targetH);
          const d = imgData.data;
          const copy = new Uint8ClampedArray(d);
          const w = targetW, h = targetH;

          for (let y = 1; y < h - 1; y++) {
            for (let x = 1; x < w - 1; x++) {
              const idx = (y * w + x) * 4;
              for (let c = 0; c < 3; c++) {
                const center = copy[idx + c] * (1 + 4 * amount);
                const neighbors = (
                  copy[idx - 4 + c] +
                  copy[idx + 4 + c] +
                  copy[idx - w * 4 + c] +
                  copy[idx + w * 4 + c]
                ) * amount;
                d[idx + c] = Math.min(255, Math.max(0, center - neighbors));
              }
            }
          }
          ctx.putImageData(imgData, 0, 0);
        }

        const mp = ((targetW * targetH) / 1000000).toFixed(2);
        status.textContent = 'Selesai! Resolusi baru: ' + targetW + ' x ' + targetH + ' px (' + mp + ' MP)';
      }, 30);
    });

    document.getElementById('btnSave').addEventListener('click', function() {
      if (!origImg) return;
      const a = document.createElement('a');
      a.download = 'upscaled-' + canvas.width + 'x' + canvas.height + '.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    });
  </script>
</body>
</html>
